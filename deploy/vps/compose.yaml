name: virtualship-academy

services:
  web:
    image: virtualship-academy:${ACADEMY_VERSION:-demo}
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
    container_name: virtualship-academy-web
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - gateway
    volumes:
      - ./secrets/academy.htpasswd:/run/secrets/academy.htpasswd:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -qx ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  gateway:
    external: true
    name: virtualship_academy_gateway

